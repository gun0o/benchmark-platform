openapi: 3.1.0
info:
  title: benchmark-platform API
  version: "1.0.0"
  description: |
    Ingests benchmark run envelopes produced by the `bench` engine and serves the stored
    measurements. The request body of POST /v1/runs is exactly the document described by
    `schema/benchmark-result.schema.json`, which is the source of truth for every field
    and enum below.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness. Always 200 while the process is running; never touches Postgres.
      operationId: getHealthz
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
  /readyz:
    get:
      summary: Readiness. Pings Postgres.
      operationId: getReadyz
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /v1/runs:
    get:
      summary: List run headers, newest first.
      operationId: listRuns
      parameters:
        - { name: machine_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: run headers
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/Run" }
        "400":
          description: bad limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Ingest one run envelope.
      description: |
        Idempotent per measurement row: `(run_id, metric, thread_count,
        working_set_bytes, trial)` is unique, so re-POSTing a run (or a chunk of one)
        stores nothing new and reports it under `skipped`. A run larger than
        `results`'s limit is split by the client into several POSTs that share one
        `run_id`; they append. The machine block is upserted by `machine.id`.

        The body is decoded as it is read, so the request is bounded by the ingest rate
        rather than by memory.
      operationId: ingestRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunEnvelope" }
      responses:
        "200":
          description: stored (or already present)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400":
          description: malformed JSON or a schema violation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: more results than one envelope may carry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/machines:
    get:
      summary: Every machine that has ever posted a run, newest sighting first.
      operationId: listMachines
      responses:
        "200":
          description: the machine inventory
          content:
            application/json:
              schema:
                type: object
                required: [machines]
                properties:
                  machines:
                    type: array
                    items: { $ref: "#/components/schemas/MachineRow" }
  /v1/machines/{id}:
    get:
      summary: One machine by its content-addressed id.
      operationId: getMachine
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: the machine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineRow" }
        "404":
          description: no such machine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/runs/{id}:
    get:
      summary: One run header with its measurement count.
      operationId: getRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: no such run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/measurements:
    get:
      summary: List stored measurements with keyset pagination.
      operationId: listMeasurements
      parameters:
        - { name: machine_id, in: query, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: workload, in: query, schema: { $ref: "#/components/schemas/Workload" } }
        - { name: metric, in: query, schema: { $ref: "#/components/schemas/Metric" } }
        - { name: thread_count, in: query, schema: { type: integer, minimum: 1 } }
        - { name: working_set_bytes, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 100 } }
        - name: cursor
          in: query
          description: Keyset cursor; return rows with id greater than this. From `next_cursor`.
          schema: { type: string }
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasurementPage" }
        "400":
          description: unknown filter value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/aggregates:
    get:
      summary: Per-group statistics for one machine and metric.
      description: |
        machine_id and metric are required: percentile_cont over the whole table is not a
        question this endpoint answers. Grouped by thread_count (default) or
        working_set_bytes; the other dimension may be pinned with its own parameter.
        Answers are cached in Redis for CACHE_TTL and invalidated by an ingest for the
        machine. `X-Cache: hit|miss` says which path served the request.
      operationId: getAggregates
      parameters:
        - { name: machine_id, in: query, required: true, schema: { type: string } }
        - { name: metric, in: query, required: true, schema: { $ref: "#/components/schemas/Metric" } }
        - { name: workload, in: query, schema: { $ref: "#/components/schemas/Workload" } }
        - { name: group_by, in: query, schema: { type: string, enum: [thread_count, working_set_bytes], default: thread_count } }
        - { name: thread_count, in: query, schema: { type: integer, minimum: 1 } }
        - { name: working_set_bytes, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: one entry per group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AggregateResponse" }
        "400":
          description: missing or invalid filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/compare:
    get:
      summary: Aligned series for several machines, with the ratio to the first.
      operationId: getCompare
      parameters:
        - name: machines
          in: query
          required: true
          description: Two to eight machine ids, comma-separated. The first is the baseline.
          schema: { type: string }
        - { name: metric, in: query, required: true, schema: { $ref: "#/components/schemas/Metric" } }
        - { name: workload, in: query, schema: { $ref: "#/components/schemas/Workload" } }
        - { name: group_by, in: query, schema: { type: string, enum: [thread_count, working_set_bytes], default: thread_count } }
        - { name: thread_count, in: query, schema: { type: integer, minimum: 1 } }
        - { name: working_set_bytes, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: one series per machine over the union of their group values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompareResponse" }
        "400":
          description: missing or invalid filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/trials:
    get:
      summary: Individual trial values for one configuration, in a compact shape.
      description: |
        Points are `[trial, value, recorded_at]` triples rather than objects, because the
        Trials page loads up to 10,000 of them. `downsample=lttb:N` applies
        Largest-Triangle-Three-Buckets server-side, keeping the extremes.
      operationId: getTrials
      parameters:
        - { name: machine_id, in: query, required: true, schema: { type: string } }
        - { name: metric, in: query, required: true, schema: { $ref: "#/components/schemas/Metric" } }
        - { name: workload, in: query, schema: { $ref: "#/components/schemas/Workload" } }
        - { name: thread_count, in: query, schema: { type: integer, minimum: 1 } }
        - { name: working_set_bytes, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 } }
        - { name: downsample, in: query, schema: { type: string, pattern: "^lttb:[0-9]+$" } }
      responses:
        "200":
          description: the trial series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialsResponse" }
        "400":
          description: missing or invalid filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Workload:
      type: string
      enum: [cpu_int, cpu_fp, cpu_hash, mem_bw, mem_latency, disk_seq, disk_rand]
    Metric:
      type: string
      enum:
        [cpu_int_ops, cpu_fp_ops, cpu_hash_ops, mem_read_bw, mem_write_bw, mem_copy_bw,
         mem_latency, disk_seq_read_bw, disk_seq_write_bw, disk_rand_read_iops,
         disk_rand_write_iops, disk_rand_read_p99_us]
    Unit:
      type: string
      enum: ["ops/s", "GB/s", "ns", "MB/s", "IOPS", "us"]
    Machine:
      type: object
      required: [id, hostname, cpu_model, physical_cores, logical_cpus, l1d_kb, l2_kb,
                 l3_kb, memory_bytes, os, kernel, compiler, compiler_flags,
                 engine_version, engine_git_sha]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        hostname: { type: string }
        cpu_model: { type: string }
        physical_cores: { type: integer, minimum: 1 }
        logical_cpus: { type: integer, minimum: 1 }
        l1d_kb: { type: integer, minimum: 0 }
        l2_kb: { type: integer, minimum: 0 }
        l3_kb: { type: integer, minimum: 0 }
        memory_bytes: { type: integer, minimum: 0 }
        os: { type: string }
        kernel: { type: string }
        compiler: { type: string }
        compiler_flags: { type: string }
        engine_version: { type: string }
        engine_git_sha: { type: string }
        virtualized: { type: string }
    Result:
      type: object
      required: [workload, thread_count, working_set_bytes, metric, value, unit, trial,
                 timestamp, duration_ns]
      properties:
        workload: { $ref: "#/components/schemas/Workload" }
        thread_count: { type: integer, minimum: 1 }
        working_set_bytes: { type: integer, minimum: 0 }
        metric: { $ref: "#/components/schemas/Metric" }
        value: { type: number }
        unit: { $ref: "#/components/schemas/Unit" }
        trial: { type: integer, minimum: 0 }
        timestamp: { type: string, format: date-time }
        duration_ns: { type: integer, minimum: 1 }
        params: { type: object, additionalProperties: true }
    Summary:
      type: object
      required: [workload, metric, thread_count, working_set_bytes, n, mean, median,
                 stddev, cov, min, p5, p95, max]
      properties:
        workload: { $ref: "#/components/schemas/Workload" }
        metric: { $ref: "#/components/schemas/Metric" }
        thread_count: { type: integer, minimum: 1 }
        working_set_bytes: { type: integer, minimum: 0 }
        n: { type: integer, minimum: 1 }
        mean: { type: number }
        median: { type: number }
        stddev: { type: number }
        cov: { type: number }
        min: { type: number }
        p5: { type: number }
        p95: { type: number }
        max: { type: number }
        mad: { type: number }
    RunEnvelope:
      type: object
      required: [schema_version, run_id, started_at, finished_at, machine, argv, results]
      properties:
        schema_version: { type: integer, enum: [1] }
        run_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        machine: { $ref: "#/components/schemas/Machine" }
        argv: { type: array, items: { type: string } }
        results: { type: array, items: { $ref: "#/components/schemas/Result" } }
        summary: { type: array, items: { $ref: "#/components/schemas/Summary" } }
    IngestResult:
      type: object
      required: [run_id, results, inserted, skipped, duplicate]
      properties:
        run_id: { type: string }
        results: { type: integer, description: Results carried by this request. }
        inserted: { type: integer, description: Rows actually written. }
        skipped: { type: integer, description: Rows already present (a repeated chunk). }
        duplicate: { type: boolean, description: Nothing in this request was new. }
        machine_id: { type: string }
    MachineRow:
      type: object
      description: |
        A stored machine. Unlike the envelope's machine block it carries no
        engine_version or engine_git_sha: those describe the engine that produced a run,
        and live on Run.
      required: [id, hostname, cpu_model, physical_cores, logical_cpus, l1d_kb, l2_kb,
                 l3_kb, memory_bytes, os, kernel, compiler, compiler_flags, first_seen,
                 last_seen]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        hostname: { type: string }
        cpu_model: { type: string }
        physical_cores: { type: integer }
        logical_cpus: { type: integer }
        l1d_kb: { type: integer }
        l2_kb: { type: integer }
        l3_kb: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        os: { type: string }
        kernel: { type: string }
        compiler: { type: string }
        compiler_flags: { type: string }
        virtualized: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        runs: { type: integer }
        measurements: { type: integer }
    Run:
      type: object
      required: [id, machine_id, engine_version, engine_git_sha, started_at, finished_at,
                 argv, ingested_at]
      properties:
        id: { type: string, format: uuid }
        machine_id: { type: string }
        engine_version: { type: string }
        engine_git_sha: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        argv: { type: array, items: { type: string } }
        ingested_at: { type: string, format: date-time }
        measurements: { type: integer }
    Measurement:
      type: object
      required: [id, run_id, machine_id, workload, metric, thread_count,
                 working_set_bytes, trial, value, unit, recorded_at, duration_ns]
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: string }
        machine_id: { type: string }
        workload: { $ref: "#/components/schemas/Workload" }
        metric: { $ref: "#/components/schemas/Metric" }
        thread_count: { type: integer }
        working_set_bytes: { type: integer, format: int64 }
        trial: { type: integer }
        value: { type: number }
        unit: { $ref: "#/components/schemas/Unit" }
        recorded_at: { type: string, format: date-time }
        duration_ns: { type: integer, format: int64 }
        params: { type: object, additionalProperties: true }
    MeasurementPage:
      type: object
      required: [measurements]
      properties:
        measurements: { type: array, items: { $ref: "#/components/schemas/Measurement" } }
        next_cursor: { type: string }
    AggregateGroup:
      type: object
      required: [group, n, mean, median, stddev, cov, min, p5, p95, max]
      properties:
        group: { type: integer, format: int64, description: The value of the group_by column. }
        n: { type: integer, format: int64 }
        mean: { type: number }
        median: { type: number, description: percentile_cont(0.5), i.e. numpy's linear interpolation. }
        stddev: { type: number, description: Sample standard deviation (n-1). }
        cov: { type: number, description: stddev / mean. }
        min: { type: number }
        p5: { type: number }
        p95: { type: number }
        max: { type: number }
    AggregateResponse:
      type: object
      required: [machine_id, metric, unit, group_by, groups]
      properties:
        machine_id: { type: string }
        metric: { $ref: "#/components/schemas/Metric" }
        workload: { $ref: "#/components/schemas/Workload" }
        unit: { $ref: "#/components/schemas/Unit" }
        group_by: { type: string, enum: [thread_count, working_set_bytes] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/AggregateGroup" }
    CompareSeries:
      type: object
      required: [machine_id, hostname, groups, median, mean, n, ratio]
      properties:
        machine_id: { type: string }
        hostname: { type: string }
        groups: { type: array, items: { type: integer, format: int64 } }
        median: { type: array, items: { type: number } }
        mean: { type: array, items: { type: number } }
        n: { type: array, items: { type: integer, format: int64 } }
        ratio:
          type: array
          items: { type: number }
          description: This machine's median divided by the baseline's, per group.
    CompareResponse:
      type: object
      required: [metric, unit, group_by, baseline, groups, series]
      properties:
        metric: { $ref: "#/components/schemas/Metric" }
        workload: { $ref: "#/components/schemas/Workload" }
        unit: { $ref: "#/components/schemas/Unit" }
        group_by: { type: string, enum: [thread_count, working_set_bytes] }
        baseline: { type: string, description: The machine every ratio is relative to. }
        groups: { type: array, items: { type: integer, format: int64 } }
        series:
          type: array
          items: { $ref: "#/components/schemas/CompareSeries" }
    TrialsResponse:
      type: object
      required: [machine_id, metric, unit, n, points]
      properties:
        machine_id: { type: string }
        metric: { $ref: "#/components/schemas/Metric" }
        unit: { $ref: "#/components/schemas/Unit" }
        n: { type: integer }
        downsample: { type: string }
        points:
          type: array
          description: "[trial, value, recorded_at] triples."
          items:
            type: array
            prefixItems:
              - { type: integer }
              - { type: number }
              - { type: string, format: date-time }
    Readiness:
      type: object
      properties:
        status: { type: string }
        postgres: { type: string }
        redis: { type: string, enum: [ok, degraded, disabled] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
